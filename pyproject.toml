[project]
name = "arrowhead"
version = "0.2.0"
description = "The secure data plane for AI agents: a hardened MCP server exposing tools, resources, prompts, and completions with OAuth 2.1, per-resource authorization, SSRF and path-traversal defenses, and content provenance."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jagadesh Varma Nadimpalli", email = "79473081+jagguvarma15@users.noreply.github.com" }
]
keywords = ["mcp", "model-context-protocol", "ai-agents", "security", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.1",
    "redis>=8.0.1",
    "regex>=2026.7.19",
]

[project.urls]
Homepage = "https://github.com/jagguvarma15/arrowhead"
Repository = "https://github.com/jagguvarma15/arrowhead"
Changelog = "https://github.com/jagguvarma15/arrowhead/blob/main/CHANGELOG.md"

[project.scripts]
arrowhead = "arrowhead.cli:main"

[project.optional-dependencies]
# The SQL connector. Kept out of the base install so a deployment that does
# not use it carries neither the parser nor a database driver. aiosqlite
# covers SQLite and the file-backed demo corpus; other drivers are added
# alongside the databases they serve.
sql = [
    "sqlglot>=25.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
]
# The Postgres and pgvector connector. Installed on top of the sql extra
# (arrowhead[sql,postgres]) so the async Postgres driver and the pgvector
# types are carried only by a deployment that serves a Postgres database.
postgres = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
]
# Exact symbol extraction for non-Python languages in symbol_map. Optional:
# without it Python uses the stdlib parser and other languages fall back to
# a line heuristic, so the base install carries no native parser.
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography>=50.0.0",
    "fakeredis[lua]>=2.36.2",
    "pyjwt[crypto]>=2.10.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so the tests package (payloads, shared
# fixtures) imports the same way under `pytest` and `python -m pytest`.
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert for verification and carry fake credentials as fixtures.
"tests/**" = ["S101", "S105", "S106"]
