# Local development stack: the server plus Redis for shared rate-limit
# state. Auth is left off here so MCP Inspector can connect without an
# authorization server; enable it by setting the ARROWHEAD_OAUTH_* and
# ARROWHEAD_AUTH_ENABLED variables before deploying anywhere real.
services:
  arrowhead:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ARROWHEAD_TRANSPORT: http
      ARROWHEAD_HOST: 0.0.0.0
      ARROWHEAD_PORT: "8000"
      ARROWHEAD_AUTH_ENABLED: "false"
      ARROWHEAD_REDIS_URL: redis://redis:6379/0
      ARROWHEAD_JAIL_ROOT: /app/sandbox
      ARROWHEAD_DOCS_ROOT: /app/documents
      # Expose only the families this stack serves: core, docs, coding, or
      # full (the default). A smaller profile keeps the tool list lean.
      # ARROWHEAD_PROFILE: full
      # The SQL and pgvector connectors run against the bundled Postgres. Set
      # ARROWHEAD_PGVECTOR_COLLECTIONS to a table you have created before the
      # vector_search tool will run.
      ARROWHEAD_SQL_DSN: postgresql+asyncpg://arrow:arrow@postgres:5432/arrow
      # Sandboxed execution is off by default. To enable it, uncomment the
      # flag AND grant the execute action in the authorization policy; prefer
      # the container runner in a real deployment for network and filesystem
      # isolation the subprocess runner does not provide.
      # ARROWHEAD_EXEC_ENABLED: "true"
      # ARROWHEAD_EXEC_RUNNER: container
      # ARROWHEAD_EXEC_CONTAINER_IMAGE: python:3.12-slim
      # ARROWHEAD_EXEC_TEST_COMMAND: python -m pytest -q
      # To back the assist tools with a local model, point the endpoint at it
      # and name its host:port so the SSRF guard admits the internal address.
      # ARROWHEAD_LLM_PROVIDER: openai
      # ARROWHEAD_LLM_ENDPOINT: http://host.docker.internal:11434/v1/chat/completions
      # ARROWHEAD_LLM_MODEL: llama3
      # ARROWHEAD_LLM_INTERNAL_HOSTS: host.docker.internal:11434
    volumes:
      # Path is relative to this compose file, so the repo-root sandbox
      # sits one level up.
      - ../sandbox:/app/sandbox:ro
      # A named volume keeps the write corpus across restarts.
      - arrowhead-corpus:/app/documents
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arrow
      POSTGRES_PASSWORD: arrow
      POSTGRES_DB: arrow
    ports:
      - "5432:5432"
    volumes:
      - arrowhead-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "arrow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  arrowhead-corpus:
  arrowhead-postgres:
