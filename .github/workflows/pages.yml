# Builds the documentation site on every change and publishes it to GitHub
# Pages from main. The site is Astro Starlight under website/, fed by three
# sources at build time: the repository documents (copied in by the ingest
# script), the reference pages generated from the code by
# scripts/gen_reference.py (which needs the project installed with all
# extras, because it imports every tool module to read the same docstrings
# the server sends over the wire), and the site-native pages. The build
# fails on any broken internal link and on drift between .env.example and
# the Settings model. Deployment uses the Pages OIDC path; no token and no
# branch push are involved.
name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install Python
        run: uv python install 3.12
      - name: Install the project
        run: uv sync --all-extras
      - name: Install the site toolchain
        run: npm ci
        working-directory: website
      - name: Generate the reference pages
        run: uv run python scripts/gen_reference.py
      - name: Build the site
        run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
