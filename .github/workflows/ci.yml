name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Postgres with pgvector, so the SQL and pgvector integration tests run
      # against a real database rather than being skipped.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arrow
          POSTGRES_PASSWORD: arrow
          POSTGRES_DB: arrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # ruff carries the flake8-bandit (S) rules, so this is also the SAST pass.
      - name: Lint and SAST
        run: uv run ruff check src/ tests/

      - name: Test
        env:
          ARROWHEAD_POSTGRES_TEST_URL: postgresql+asyncpg://arrow:arrow@localhost:5432/arrow
        run: uv run pytest tests/ -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit, not a shallow clone.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Audit dependencies for known vulnerabilities
        run: uv run --with pip-audit pip-audit

      - name: Scan filesystem for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          scan-ref: .

      - name: Scan deploy configs for misconfiguration
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          severity: CRITICAL,HIGH
          exit-code: "1"
          scan-ref: deploy

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: arrowhead-sbom.cyclonedx.json
