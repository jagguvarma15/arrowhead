# Publishes the container image when a release tag is pushed. Nothing here
# runs on ordinary pushes or pull requests: cutting a tag is the owner's
# explicit release action, and the image name carries the tag (no floating
# latest tag), so downstream consumers always pin an exact version. The
# image is scanned with the same gate CI applies before it is pushed.
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Name the image from the tag
        run: echo "IMAGE=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build the container image
        run: docker build -f deploy/Dockerfile -t "$IMAGE" .

      - name: Scan the image before publishing
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Gate on findings a rebuild can actually fix; base-image CVEs
          # Debian has not patched yet would otherwise block every release.
          ignore-unfixed: true

      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push the image
        run: docker push "$IMAGE"

      - name: Record the published digest
        run: docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE"
